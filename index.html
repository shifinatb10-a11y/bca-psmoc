<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCA Department Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('bca-theme') || 'dark');</script>
</head>
<body>
<div class="bg-anim" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
  <span class="grid-overlay"></span>
</div>
<div id="app"></div>
<button class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
  <span class="tt-track">
    <span class="tt-icon sun">☀</span>
    <span class="tt-icon moon">☾</span>
    <span class="tt-knob"></span>
  </span>
</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/render.js"></script>
<script src="js/handlers.js"></script>
<script src="js/main.js"></script>
</body>
</html>
